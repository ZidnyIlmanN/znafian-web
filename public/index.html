<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#747878",
                        "secondary-container": "#e1dfdf",
                        "background": "#fdf8f8",
                        "primary-fixed": "#e5e2e1",
                        "surface-container-low": "#f7f3f2",
                        "surface-tint": "#5f5e5e",
                        "surface-variant": "#e5e2e1",
                        "on-surface": "#1c1b1b",
                        "surface-container-highest": "#e5e2e1",
                        "secondary": "#5e5e5e",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#e6e1df",
                        "on-primary-fixed-variant": "#474646",
                        "tertiary-container": "#1d1b1a",
                        "primary": "#000000",
                        "secondary-fixed": "#e4e2e2",
                        "surface-bright": "#fdf8f8",
                        "on-surface-variant": "#444748",
                        "primary-fixed-dim": "#c8c6c5",
                        "on-primary-fixed": "#1c1b1b",
                        "surface-dim": "#ddd9d8",
                        "primary-container": "#1c1b1b",
                        "surface-container": "#f1edec",
                        "inverse-surface": "#313030",
                        "on-primary-container": "#858383",
                        "on-secondary-fixed-variant": "#464747",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#626262",
                        "on-error-container": "#93000a",
                        "outline-variant": "#c4c7c7",
                        "surface-container-high": "#ebe7e6",
                        "on-tertiary-fixed-variant": "#484645",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#868381",
                        "inverse-primary": "#c8c6c5",
                        "tertiary": "#000000",
                        "surface": "#fdf8f8",
                        "inverse-on-surface": "#f4f0ef",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#cac6c3",
                        "on-tertiary-fixed": "#1d1b1a",
                        "on-background": "#1c1b1b",
                        "on-secondary-fixed": "#1b1c1c",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "container-max": "1280px",
                        "unit": "8px",
                        "margin-mobile": "20px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "headline-md": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "display-xl": ["Hanken Grotesk"],
                        "label-caps": ["Hanken Grotesk"],
                        "display-lg-mobile": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-md": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "display-lg": ["56px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                        "display-xl": ["72px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600"}],
                        "display-lg-mobile": ["40px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    },
                    "keyframes": {
                        "gradient-border": {
                            "0%, 100%": { borderRadius: "37% 29% 27% 27% / 28% 25% 41% 37%" },
                            "25%": { borderRadius: "47% 29% 39% 49% / 61% 19% 66% 26%" },
                            "50%": { borderRadius: "57% 23% 47% 72% / 63% 17% 66% 33%" },
                            "75%": { borderRadius: "28% 49% 29% 100% / 93% 20% 64% 25%" },
                        },
                        "gradient-1": {
                            "0%, 100%": { top: "0", right: "0" },
                            "50%": { top: "50%", right: "25%" },
                            "75%": { top: "25%", right: "50%" },
                        },
                        "gradient-2": {
                            "0%, 100%": { top: "0", left: "0" },
                            "60%": { top: "75%", left: "25%" },
                            "85%": { top: "50%", left: "50%" },
                        },
                        "gradient-3": {
                            "0%, 100%": { bottom: "0", left: "0" },
                            "40%": { bottom: "50%", left: "25%" },
                            "65%": { bottom: "25%", left: "50%" },
                        },
                        "gradient-4": {
                            "0%, 100%": { bottom: "0", right: "0" },
                            "50%": { bottom: "25%", right: "40%" },
                            "90%": { bottom: "50%", right: "25%" },
                        },
                    }
                },
            },
        }
    </script>
    <style>
        :root {
            --color-1: 34 100% 40%;
            --color-2: 27 89% 58%;
            --color-3: 343 53% 52%;
            --color-4: 268 43% 44%;
            --color-5: 222 44% 9%;
        }
        body { background-color: #fdf8f8; color: #1c1b1b; }
        .swiss-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
        @media (max-width: 768px) { .swiss-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
        .hairline-b { border-bottom: 1px solid #c4c7c7; }
        .hairline-r { border-right: 1px solid #c4c7c7; }
        .hairline-l { border-left: 1px solid #c4c7c7; }
        .hairline-t { border-top: 1px solid #c4c7c7; }
        .strikethrough-hover:hover { text-decoration: line-through; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body>
    <noscript>
        <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.28.0/feather.min.js"></script>
</body>
</html>
